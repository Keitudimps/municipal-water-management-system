services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aquaalert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquaalert
      POSTGRES_PASSWORD: aquaalert
      POSTGRES_DB: aquaalert
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
